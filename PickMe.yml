name: pickme
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip

  # PickMe runtime dependencies.
  - numpy
  - pandas
  - matplotlib
  - starfile
  - mrcfile
  - napari
  - napari-skimage
  - scikit-image
  - seaborn
  - plotly
  - tqdm
  - scipy

  # Keep the Qt/PyQt GUI stack in conda-forge.
  # Installing these through pip can mix incompatible Qt libraries.
  - pyqt6
  - qt6-main
  - xcb-util
  - xcb-util-image
  - xcb-util-keysyms
  - xcb-util-renderutil
  - xcb-util-wm
  - libxkbcommon

  # Install this local package without letting pip replace conda's Qt stack.
  - pip:
      - --no-deps
      - -e .
