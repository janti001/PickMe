[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name="PickMe-EM"
version="0.1.1"
authors=[{name="Joe Antinoro", email="ucbtj22@ucl.ac.uk"}]
description="A tool to be incorporated into membrane segmentation and particle picking pipelines."
readme="README.md"
requires-python=">=3.12"
dependencies=[
	'numpy',
	'pandas',
	'matplotlib',
	'starfile',
	'mrcfile',
	'scikit-image',
	'seaborn',
	'plotly',
	'tqdm',
	'scipy',

	# --- GUI stack (napari + Qt) -------------------------------------------
	# These are pinned much more tightly than the rest. `choose_objects`
	# drives the napari-skimage Regionprops widget by reaching into its Qt
	# widget tree (see src/PickMe/gui/napari_compat.py), so a single minor
	# release of either package can silently break object selection. The
	# ranges below are the combination PickMe is tested against; keep them in
	# step with SUPPORTED_VERSIONS in gui/napari_compat.py and with
	# PickMe.yml.
	#
	# NOTE: conda-forge, not pip, is the supported install path for the GUI
	# on Linux/WSL/HPC - pip wheels can mix incompatible Qt libraries. See
	# docs/gui-setup.md.
	'napari>=0.7.0,<0.8',
	'napari-skimage>=0.6.0,<0.7',
	'qtpy>=2.4,<3',
	'PyQt6>=6.9,<6.12',
	]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license="GPL-3.0-or-later"
license-files=["LICEN[CS]E*"]
keywords=['picking', 'membrane', 'picker', 'pickme', 'Pickme', 'PickMe']

[project.urls]
HomePage="https://github.com/janti001/PickMe"


[project.scripts]
PickMe = 'PickMe.cli:main'
